name: Deploy Convex Backend

on:
  push:
    branches: [main]
    paths:
      - 'convex/**'
      - 'convex.json'
      - 'convex.config.ts'
      - 'convex.config.js'
      - '.github/workflows/convex-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-convex:
    name: Deploy Convex Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          # Ensure we have the correct esbuild version
          npm install esbuild@0.25.0 --force

      - name: Validate Convex production key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Missing required GitHub Actions secret CONVEX_DEPLOY_KEY. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to Convex Production
        run: |
          npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: courteous-wildcat-368

  deploy-dev:
    name: Deploy Convex Dev
    runs-on: ubuntu-latest
    needs: deploy-convex
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install esbuild@0.25.0 --force

      - name: Validate Convex development key
        env:
          CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEV_DEPLOY_KEY" ]; then
            echo "::error::Missing required GitHub Actions secret CONVEX_DEV_DEPLOY_KEY. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to Convex Dev
        run: |
          npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: moonlit-chinchilla-285