name: Security & Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # Temporary compatibility bridge for the existing Next.js 14 / WorkOS peer-range mismatch.
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Install app-portal dependencies
        run: npm ci --prefix app-portal

      - name: Type check app-portal
        # This workflow validates the MCP MVP app. Legacy src/ app type debt is tracked separately.
        run: cd app-portal && npx tsc --noEmit

      - name: Run npm audit (high severity and above)
        run: npm audit --audit-level=high
