name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "public/**"
      - "api/**"
      - "backend/**"
      - "app-portal/**"
      - "explorer/**"
      - "convex/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "public/**"
      - "api/**"
      - "backend/**"
      - "app-portal/**"
      - "explorer/**"
      - "convex/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint main site and app portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install main-site dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint main site
        run: npm run lint
      - name: Install portal dependencies
        working-directory: app-portal
        run: npm ci
      - name: Lint app portal
        working-directory: app-portal
        run: npm run lint

  build-main-site:
    name: Build main website
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_PUBLIC_API_URL: https://api.decentralizedrights.com
      NEXT_PUBLIC_RPC_URL: https://rpc.decentralizedrights.com
      NEXT_PUBLIC_CHAIN_ID: "31337"
      NEXT_PUBLIC_IPFS_GATEWAY: https://ipfs.decentralizedrights.com
      NEXT_PUBLIC_AI_API: https://ai.decentralizedrights.com
      NEXT_PUBLIC_LEARN_URL: https://decentralizedrights.com/learn
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build

  build-app-portal:
    name: Build app portal
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_PUBLIC_API_URL: https://api.decentralizedrights.com
      NEXT_PUBLIC_RPC_URL: https://rpc.decentralizedrights.com
      NEXT_PUBLIC_CHAIN_ID: "31337"
      NEXT_PUBLIC_IPFS_GATEWAY: https://ipfs.decentralizedrights.com
      NEXT_PUBLIC_AI_API: https://ai.decentralizedrights.com
      NEXT_PUBLIC_LEARN_URL: https://decentralizedrights.com/learn
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-portal/package-lock.json
      - name: Install dependencies
        working-directory: app-portal
        run: npm ci
      - name: Build
        working-directory: app-portal
        run: npm run build

  build-explorer:
    name: Build blockchain explorer
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: explorer
        run: npm install --legacy-peer-deps
      - name: Build
        working-directory: explorer
        run: npm run build

  validate-backend-python:
    name: Validate backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q .
